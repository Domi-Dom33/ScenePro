<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScènePro — Conducteur</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#0a0c0f;--panel:#12151a;--panel2:#171b21;--panel3:#1f242c;--line:#262c35;--line2:#343c48;--text:#e7eaee;--muted:#8b93a0;--dim:#5b6370;
  --green:#1fd16b;--red:#ff3b3b;--amber:#ffb020;--accent:#3d8bff;--mono:"Cascadia Mono","Consolas",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0d1014;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand img{width:28px;height:28px}
.brand small{color:var(--muted);font-weight:500}
.sp{flex:1}
.kv{display:flex;flex-direction:column;align-items:flex-end}
.kv small{font-size:10px;letter-spacing:1.3px;font-weight:700;color:var(--muted)}
.kv b{font-family:var(--mono);font-size:20px;font-weight:600}
.clock{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:1px}
.pill{font-size:11px;font-weight:800;letter-spacing:1.2px;padding:5px 10px;border-radius:6px;background:var(--panel3);color:var(--muted)}
.pill.air{background:var(--red);color:#fff}.pill.blk{background:#000;border:1px solid var(--amber);color:var(--amber)}.pill.off{background:rgba(255,59,59,.15);color:#ffb3b3}
main{padding:16px 18px;max-width:1300px;margin:0 auto}
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.now .lbl{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#ff8a8a}
.now .nm{font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .rem{grid-row:1/3;grid-column:2;font-family:var(--mono);font-size:56px;font-weight:700;line-height:1;text-align:right}
.now .rem.warn{color:var(--amber)}.now .rem.crit{color:var(--red);animation:blink .8s infinite}
.now .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.now .bar i{display:block;height:100%;background:var(--red);width:0}
.now .sub{color:var(--muted);font-family:var(--mono);font-size:13px}
@keyframes blink{50%{opacity:.3}}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-size:10.5px;letter-spacing:1.2px;font-weight:700;color:var(--muted);text-align:left;padding:0 10px;text-transform:uppercase;white-space:nowrap}
td{background:var(--panel);padding:11px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px}
td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0}
td.name{white-space:normal;font-weight:600;width:100%}
td.mono{font-family:var(--mono)}
td.big{font-family:var(--mono);font-size:17px;font-weight:600}
tr.done td{opacity:.42}
tr.air td{background:rgba(255,59,59,.1);border-color:rgba(255,59,59,.45)}
tr.next td{background:rgba(31,209,107,.07);border-color:rgba(31,209,107,.4)}
.chip{font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:4px;background:var(--panel3);color:var(--muted)}
.chip.air{background:var(--red);color:#fff}.chip.next{background:var(--green);color:#03250f}
.late{color:#ff8a8a}.early{color:#9ef0bf}.ontime{color:var(--muted)}
.unk{color:var(--amber)}
.type{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.codebox{max-width:420px;margin:60px auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px}
.codebox input{width:100%;height:44px;font:600 22px var(--mono);letter-spacing:6px;text-align:center;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--text);margin:12px 0}
.codebox button{width:100%;height:40px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.warnbar{padding:10px 14px;border-radius:9px;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:#ffd27a;margin-bottom:12px;font-size:13px}
@media (max-width:760px){.now .rem{font-size:38px}.now .nm{font-size:20px}.hide-s{display:none}td,th{padding-left:6px;padding-right:6px}.clock{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/favicon.ico" alt="">ScènePro <small>Conducteur · <span id="show">—</span></small></div>
  <span class="pill" id="state">—</span>
  <div class="sp"></div>
  <div class="kv"><small>FIN ESTIMÉE</small><b id="end">--:--:--</b></div>
  <div class="kv"><small>RESTE À DIFFUSER</small><b id="left">--:--</b></div>
  <div class="clock" id="clock">--:--:--</div>
</header>
<main id="main"><div class="empty">Connexion à la régie…</div></main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hms = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
const delta = s => s == null ? '' : Math.abs(s) < 30 ? '<span class="ontime">à l\'heure</span>' : s > 0 ? `<span class="late">+${dur(s)} retard</span>` : `<span class="early">−${dur(-s)} avance</span>`;
const TYPES = {video: 'VIDÉO', image: 'IMAGE', live: 'LIVE'};
let code = new URLSearchParams(location.search).get('code') || (() => { try{ return localStorage.getItem('scenepro-code') || ''; }catch(e){ return ''; } })();
let data = null, offset = 0, showDone = (() => { try{ return localStorage.getItem('scenepro-cd-done') === '1'; }catch(e){ return false; } })(), needCode = false, lastOk = 0;

let trying = false;
async function poll(){
  // en attente du code : on ne réinterroge pas le serveur tant que l'utilisateur n'a pas validé sa saisie
  if(needCode && !trying) return;
  trying = false;
  try{
    const r = await fetch('/api/conducteur' + (code ? '?code=' + encodeURIComponent(code) : ''), {cache: 'no-store'});
    if(r.status === 401 || r.status === 403){ needCode = true; data = null; render(r.status === 403 ? 'Trop d\'essais : patientez 2 minutes.' : (code ? 'Code incorrect.' : '')); return; }
    const j = await r.json();
    needCode = false; offset = j.now - Date.now(); data = j; lastOk = Date.now();
    try{ if(code) localStorage.setItem('scenepro-code', code); }catch(e){}
    render();
  }catch(e){ render(); }
}
function codeForm(msg){
  $('#main').innerHTML = `<div class="codebox"><b>Code d'accès de la régie</b><div style="color:var(--muted);font-size:13px;margin-top:6px">6 chiffres, affichés dans la régie : Sorties › Accès réseau (ou Fichier › Conducteur).</div>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(code)}"><button id="go">Afficher le conducteur</button>
    <div id="codeMsg" style="color:#ffb3b3;font-size:13px;margin-top:10px;min-height:18px">${esc(msg || '')}</div></div>`;
  const go = () => { code = $('#code').value.replace(/\D/g, ''); trying = true; $('#codeMsg').textContent = 'Vérification…'; poll(); };
  $('#go').onclick = go; $('#code').onkeydown = e => { if(e.key === 'Enter') go(); }; $('#code').focus();
}
function render(msg){
  const now = Date.now() + offset;
  $('#clock').textContent = hms(now);
  // le formulaire n'est construit qu'une fois : on ne met à jour que le message, sans effacer la saisie
  if(needCode){ if(!$('#code')) codeForm(msg); else if(msg != null) $('#codeMsg').textContent = msg; return; }
  const stale = !lastOk || Date.now() - lastOk > 5000;
  if(!data || !data.r){
    $('#state').className = 'pill off'; $('#state').textContent = stale ? 'SERVEUR INJOIGNABLE' : 'RÉGIE FERMÉE';
    $('#main').innerHTML = `<div class="empty">${stale ? 'Le serveur ScènePro ne répond pas. Vérifiez que la régie est allumée et l\'adresse de cette page.' : 'La régie n\'est pas ouverte : le conducteur apparaîtra dès son ouverture.'}</div>`;
    return;
  }
  const R = data.r, ago = (now - R.at) / 1000;   // temps écoulé depuis le calcul de la régie
  $('#show').textContent = R.show || '—';
  const st = $('#state');
  if(stale || !data.regie){ st.className = 'pill off'; st.textContent = stale ? 'LIAISON PERDUE' : 'RÉGIE FERMÉE'; }
  else if(R.black){ st.className = 'pill blk'; st.textContent = 'NOIR'; }
  else if(R.onAir){ st.className = 'pill air'; st.textContent = R.paused ? 'PAUSE' : 'À L\'ANTENNE'; }
  else { st.className = 'pill'; st.textContent = 'AUCUN PROGRAMME'; }
  const shift = R.paused ? 0 : ago * 1000;
  const remCur = Math.max(0, R.curRemain - (R.paused ? 0 : ago));
  const todo = R.rows.filter(r => r.status === 'todo');
  const leftS = remCur + todo.reduce((a, r) => a + r.dur, 0);
  $('#left').textContent = dur(leftS) + (R.unknown ? ' +?' : '');
  $('#end').textContent = hms(R.end + shift) + (R.unknown ? ' +?' : '');
  const air = R.rows.find(r => r.status === 'air');
  let html = '';
  if(R.unknown) html += `<div class="warnbar">${R.unknown} média(s) à venir sans durée connue (image fixe, live, boucle) : renseignez « Durée prévue » dans la régie pour une fin estimée exacte.</div>`;
  if(air){
    const tot = R.curDur || 0, el = R.curElapsed + (R.paused ? 0 : ago);
    const cls = tot && remCur <= 5 ? 'crit' : tot && remCur <= 10 ? 'warn' : '';
    html += `<div class="now"><div><div class="lbl">À L'ANTENNE · PGM 1</div><div class="nm">${esc(air.name)}</div><div class="sub">début ${hms(air.start)} · écoulé ${dur(el)}${tot ? ' / ' + dur(tot) : ''}</div></div>
      <div class="rem ${cls}">${tot ? '−' + dur(remCur) : dur(el)}</div><div class="bar"><i style="width:${tot ? Math.min(100, el / tot * 100) : 0}%"></i></div></div>`;
  }
  const rows = R.rows.filter(r => showDone || r.status !== 'done');
  html += `<div class="tools"><label><input type="checkbox" id="done" ${showDone ? 'checked' : ''}> Afficher les médias déjà diffusés</label><span>${todo.length} média(s) à venir</span></div>`;
  html += rows.length ? `<table><thead><tr><th>N°</th><th>Média</th><th class="hide-s">Type</th><th>Durée</th><th>Prévu</th><th>Estimé</th><th class="hide-s">Écart</th><th></th></tr></thead><tbody>` + rows.map(r => {
    const est = r.status === 'todo' && r.start ? r.start + shift : r.start;
    const d = r.status === 'todo' && r.planned && est ? Math.round((est - r.planned) / 1000) : r.status === 'air' ? r.delta : null;
    return `<tr class="${r.status}${r.next ? ' next' : ''}"><td class="mono">${String(r.n).padStart(2, '0')}</td><td class="name">${esc(r.name)}</td>
      <td class="hide-s"><span class="type">${TYPES[r.type] || ''}</span></td>
      <td class="mono">${r.dur ? dur(r.dur) : '<span class="unk">?</span>'}</td>
      <td class="mono">${r.plannedAt ? esc(r.plannedAt.slice(0, 5)) : '—'}</td>
      <td class="big">${r.status === 'done' ? '<span class="type">DIFFUSÉ</span>' : est ? hms(est) : '—'}</td>
      <td class="hide-s">${r.status === 'done' ? '' : delta(d)}</td>
      <td>${r.status === 'air' ? '<span class="chip air">ANTENNE</span>' : r.next ? '<span class="chip next">SUIVANT</span>' : ''}</td></tr>`;
  }).join('') + '</tbody></table>' : '<div class="empty">Aucun média dans la liste de la régie.</div>';
  $('#main').innerHTML = html;
  $('#done').onchange = e => { showDone = e.target.checked; try{ localStorage.setItem('scenepro-cd-done', showDone ? '1' : '0'); }catch(err){} render(); };
}
poll(); setInterval(poll, 1000); setInterval(() => { if(!needCode) render(); }, 250);
</script>
</body>
</html>
