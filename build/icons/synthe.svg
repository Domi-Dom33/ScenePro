<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="socle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222730"/><stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="pastille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c9dff"/><stop offset="1" stop-color="#1d5fd0"/>
    </linearGradient>
  </defs>
  <!-- socle commun de la famille ScènePro -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#socle)"/>
  <!-- écran programme -->
  <rect x="96" y="118" width="320" height="190" rx="24" fill="none" stroke="#3d8bff" stroke-width="20"/>
  <!-- synthé (bandeau titre) incrusté en bas à gauche de l'écran -->
  <rect x="126" y="222" width="196" height="38" rx="6" fill="#3d8bff"/>
  <rect x="126" y="266" width="132" height="22" rx="5" fill="#ffffff" fill-opacity=".92"/>
  <!-- pastille « T » (titrage) -->
  <circle cx="256" cy="380" r="62" fill="url(#pastille)"/>
  <rect x="222" y="350" width="68" height="16" rx="4" fill="#ffffff"/>
  <rect x="248" y="350" width="16" height="62" rx="4" fill="#ffffff"/>
</svg>
